<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Products</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }
    .product {
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <h1>Product List</h1>
  <div id="products"></div>

  <script>
    async function loadProducts() {
      const res = await fetch('/products')
      const data = await res.json()

      const container = document.getElementById('products')
      container.innerHTML = ''

      data.items.forEach(product => {
        const div = document.createElement('div')
        div.className = 'product'

        const name = product.description || "No Description"
        const price = product.likes || 0

        div.innerHTML = `
          <h3>${name}</h3>
          <p><strong>Likes (as price):</strong> ${price}</p>
          <p><strong>ID:</strong> ${product.id}</p>
        `

        container.appendChild(div)
      })
    }

    loadProducts()
  </script>

</body>
</html>
